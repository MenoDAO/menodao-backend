name: CI/CD

# Build/test on every PR and push. On a push to dev/main, build and push the
# image to ECR (us-west-2) with OIDC, then deploy over SSH to the Lightsail host.
#
# Required repository variables (Settings -> Secrets and variables -> Actions):
#   ECR_REGISTRY       e.g. 123456789551.dkr.ecr.us-west-2.amazonaws.com
#   AWS_ROLE_ARN_DEV   arn:aws:iam::<account>:role/menodao-ci-dev
#   AWS_ROLE_ARN_PROD  arn:aws:iam::<account>:role/menodao-ci-prod
#   DEPLOY_ENABLED     "true" once the host has .env files and the repo cloned
#
# Required repository secrets:
#   DEPLOY_SSH_KEY     private key for the host user
#   DEPLOY_HOST        host IP or DNS name
#   DEPLOY_USER        optional, defaults to ubuntu

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: menodao-backend

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint || true

      - name: Test
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  build-push:
    name: Build and push image
    needs: build-test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      vars.ECR_REGISTRY != '' &&
      vars.AWS_ROLE_ARN_DEV != '' &&
      vars.AWS_ROLE_ARN_PROD != ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      env: ${{ steps.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment and tag
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET_ENV: ${{ steps.meta.outputs.env }}
        run: |
          set -euo pipefail
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"
          if [ "$TARGET_ENV" = "prod" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:prod"
            docker push "$IMAGE:prod"
          else
            docker tag "$IMAGE:$TAG" "$IMAGE:dev"
            docker push "$IMAGE:dev"
          fi

  deploy:
    name: Deploy ${{ needs.build-push.outputs.env }}
    needs: build-push
    if: needs.build-push.result == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.build-push.outputs.tag }}
          TARGET_ENV: ${{ needs.build-push.outputs.env }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          USER="${DEPLOY_USER:-ubuntu}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key "$USER@$DEPLOY_HOST" \
            "cd /opt/menodao/infra && ./scripts/deploy.sh $TARGET_ENV $TAG"
