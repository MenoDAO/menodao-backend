name: Sync env to SSM

# Pushes repository secrets into SSM Parameter Store, which is what the host's
# menodao-env-sync.timer reads. This is how a key rotation reaches the running
# containers without an SSH session and without rebuilding an image.
#
# Why not bake these into the image: build args and layer contents are
# recoverable from ECR, they would make the dev and prod images different
# artifacts, and rotation would require a full rebuild + redeploy.
#
# Required repository variables:
#   AWS_ROLE_ARN_SECRETS_DEV   arn:aws:iam::854481201551:role/menodao-secrets-sync-dev
#   AWS_ROLE_ARN_SECRETS_PROD  arn:aws:iam::854481201551:role/menodao-secrets-sync-prod
#
# Required repository secrets: the names listed in SECRET_KEYS below. Missing
# ones are skipped, so you can fill this in incrementally without blanking a
# live value.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
  push:
    branches: [dev, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: secrets-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to SSM
    runs-on: ubuntu-latest
    env:
      # Keep this list in sync with env/prod.env.example. Add a key here and as
      # a repository secret; nothing else needs to change.
      SECRET_KEYS: >-
        JWT_SECRET
        TURNSTILE_SECRET_KEY
        SASAPAY_CLIENT_ID
        SASAPAY_CLIENT_SECRET
        SASAPAY_MERCHANT_CODE
        SMS_PROVIDER_URL
        SMS_PROVIDER_API_KEY
        SMS_PROVIDER_PARTNER_ID
        SMS_SENDER_ID
        MENODAO_CONTRACT_ADDRESS
        BLOCKCHAIN_PRIVATE_KEY
        CLAIM_VAULT_CONTRACT_ADDRESS
        AGENT_SIGNER_PRIVATE_KEY
        AGENT_SIGNER_ADDRESS
        VISION_API_KEY
        VISION_API_ENDPOINT
        WHATSAPP_VERIFY_TOKEN
        WHATSAPP_ACCESS_TOKEN
        WHATSAPP_APP_SECRET
        WHATSAPP_PHONE_NUMBER_ID
        GEMINI_API_KEY
        OPENAI_API_KEY
        ASSEMBLY_AI_API_KEY
        WABOXAPP_API_TOKEN
        WABOXAPP_PHONE_NUMBER
        FLARESEND_API_KEY
        FLARESEND_BASE_URL
        FLARESEND_WEBHOOK_PATH_TOKEN
        FLARESEND_INSTANCE_ID
        RUNTIME_AWS_ACCESS_KEY_ID
        RUNTIME_AWS_SECRET_ACCESS_KEY
      # Secret values are mapped here; the loop reads them by name so an unset
      # secret can be skipped instead of overwriting a good value with "".
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      SASAPAY_CLIENT_ID: ${{ secrets.SASAPAY_CLIENT_ID }}
      SASAPAY_CLIENT_SECRET: ${{ secrets.SASAPAY_CLIENT_SECRET }}
      SASAPAY_MERCHANT_CODE: ${{ secrets.SASAPAY_MERCHANT_CODE }}
      SMS_PROVIDER_URL: ${{ secrets.SMS_PROVIDER_URL }}
      SMS_PROVIDER_API_KEY: ${{ secrets.SMS_PROVIDER_API_KEY }}
      SMS_PROVIDER_PARTNER_ID: ${{ secrets.SMS_PROVIDER_PARTNER_ID }}
      SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
      MENODAO_CONTRACT_ADDRESS: ${{ secrets.MENODAO_CONTRACT_ADDRESS }}
      BLOCKCHAIN_PRIVATE_KEY: ${{ secrets.BLOCKCHAIN_PRIVATE_KEY }}
      CLAIM_VAULT_CONTRACT_ADDRESS: ${{ secrets.CLAIM_VAULT_CONTRACT_ADDRESS }}
      AGENT_SIGNER_PRIVATE_KEY: ${{ secrets.AGENT_SIGNER_PRIVATE_KEY }}
      AGENT_SIGNER_ADDRESS: ${{ secrets.AGENT_SIGNER_ADDRESS }}
      VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
      VISION_API_ENDPOINT: ${{ secrets.VISION_API_ENDPOINT }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ASSEMBLY_AI_API_KEY: ${{ secrets.ASSEMBLY_AI_API_KEY }}
      WABOXAPP_API_TOKEN: ${{ secrets.WABOXAPP_API_TOKEN }}
      WABOXAPP_PHONE_NUMBER: ${{ secrets.WABOXAPP_PHONE_NUMBER }}
      FLARESEND_API_KEY: ${{ secrets.FLARESEND_API_KEY }}
      FLARESEND_BASE_URL: ${{ secrets.FLARESEND_BASE_URL }}
      FLARESEND_INSTANCE_ID: ${{ secrets.FLARESEND_INSTANCE_ID }}
      RUNTIME_AWS_ACCESS_KEY_ID: ${{ secrets.RUNTIME_AWS_ACCESS_KEY_ID }}
      RUNTIME_AWS_SECRET_ACCESS_KEY: ${{ secrets.RUNTIME_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Resolve environment and role
        id: meta
        env:
          INPUT_ENV: ${{ github.event.inputs.environment }}
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_SECRETS_DEV }}
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN_SECRETS_PROD }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_ENV}" ]; then
            ENV="${INPUT_ENV}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          if [ "${ENV}" = "prod" ]; then ROLE="${ROLE_PROD}"; else ROLE="${ROLE_DEV}"; fi
          if [ -z "${ROLE}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "::error::AWS_ROLE_ARN_SECRETS_$(echo "${ENV}" | tr a-z A-Z) is not set"
              exit 1
            fi
            # Not configured yet: do not paint every push red.
            echo "::warning::AWS_ROLE_ARN_SECRETS_$(echo "${ENV}" | tr a-z A-Z) is not set; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "env=${ENV}" >> "$GITHUB_OUTPUT"
          echo "role=${ROLE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: steps.meta.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.meta.outputs.role }}
          aws-region: us-west-2

      - name: Select per-environment webhook token
        if: steps.meta.outputs.skip != 'true'
        env:
          TARGET_ENV: ${{ steps.meta.outputs.env }}
          TOKEN_DEV: ${{ secrets.FLARESEND_WEBHOOK_PATH_TOKEN_DEV }}
          TOKEN_PROD: ${{ secrets.FLARESEND_WEBHOOK_PATH_TOKEN_PROD }}
        run: |
          set -euo pipefail
          if [ "${TARGET_ENV}" = "prod" ]; then
            TOKEN="${TOKEN_PROD}"
          else
            TOKEN="${TOKEN_DEV}"
          fi
          # The multi-line form keeps the value out of the run log.
          {
            echo "FLARESEND_WEBHOOK_PATH_TOKEN<<__EOF__"
            echo "${TOKEN}"
            echo "__EOF__"
          } >> "${GITHUB_ENV}"

      - name: Put parameters
        if: steps.meta.outputs.skip != 'true'
        env:
          TARGET_ENV: ${{ steps.meta.outputs.env }}
        run: |
          set -euo pipefail
          PREFIX="/menodao/${TARGET_ENV}"

          # Payload is built in Python so values containing quotes, backslashes
          # or newlines cannot break the JSON.
          cat > /tmp/ssm-payload.py <<'PY'
          import json, os
          print(json.dumps({
              "Name": os.environ["PARAM_NAME"],
              "Value": os.environ["PARAM_VALUE"],
              "Type": "SecureString",
              "Overwrite": True,
              "Tier": "Standard",
          }))
          PY

          written=0
          skipped=0

          for key in ${SECRET_KEYS}; do
            # configure-aws-credentials owns AWS_ACCESS_KEY_ID in this job, so
            # the runtime key pair is read from RUNTIME_* secrets and written
            # under its real name.
            case "${key}" in
              RUNTIME_AWS_ACCESS_KEY_ID) param_name="AWS_ACCESS_KEY_ID" ;;
              RUNTIME_AWS_SECRET_ACCESS_KEY) param_name="AWS_SECRET_ACCESS_KEY" ;;
              *) param_name="${key}" ;;
            esac

            value="${!key-}"
            if [ -z "${value}" ]; then
              echo "skip   ${param_name} (repository secret ${key} not set)"
              skipped=$((skipped + 1))
              continue
            fi

            # Value travels through the environment, not argv, so it never
            # appears in the process table or the run log.
            PARAM_NAME="${PREFIX}/${param_name}" PARAM_VALUE="${value}" \
              python3 /tmp/ssm-payload.py > /tmp/ssm-payload.json

            aws ssm put-parameter --cli-input-json file:///tmp/ssm-payload.json \
              --region us-west-2 > /dev/null
            rm -f /tmp/ssm-payload.json
            echo "write  ${param_name}"
            written=$((written + 1))
          done

          rm -f /tmp/ssm-payload.py
          echo "::notice::${written} parameters written to ${PREFIX}, ${skipped} skipped"
          if [ "${written}" -eq 0 ]; then
            echo "::warning::nothing was written; check the repository secrets"
          fi
